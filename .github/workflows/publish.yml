name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Run tests
        run: npm test
      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "kiro-for-omp@$version" version >/dev/null 2>&1; then
            echo "kiro-for-omp@$version is already on npm"
          else
            npm publish --provenance --access public
          fi
